# ─────────────────────────────────────────────────────────────────────────────
# nginx — reverse proxy + load balancer for the clinic Next.js app.
#
# Public entry point on :80. All traffic is proxied to the `app` service on the
# internal compose network (port 4000). The app container publishes NO host
# port, so scaling it (`docker compose up --scale app=N`) is collision-free and
# nginx balances across every replica.
#
# HOW LOAD BALANCING WORKS (important):
#   We do NOT use a static `upstream { server app:4000; }` block — nginx would
#   resolve that name ONCE at startup and pin to a single replica. Instead each
#   location uses a *variable* proxy_pass (`set $app_upstream ...`) together with
#   Docker's embedded DNS (`resolver 127.0.0.11`). The variable form makes nginx
#   re-resolve `app` per request; Docker DNS returns all replica IPs round-robin,
#   so requests spread across replicas and newly-scaled ones join within ~10s.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker's embedded DNS. `valid=10s` re-resolves so scaled replicas are
    # picked up (and dead ones dropped) within 10 seconds. ipv6=off avoids
    # spurious AAAA lookups on the bridge network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/rss+xml
        image/svg+xml;

    # Allow file uploads (patient documents, avatars, etc.).
    client_max_body_size 25m;

    # ── WebSocket / RSC streaming upgrade mapping ───────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Log which replica served each request ($upstream_addr) — this is how you
    # prove the load balancer is spreading traffic. `rt` is total request time.
    log_format lb '$remote_addr -> $upstream_addr [$time_local] '
                  '"$request" $status ${body_bytes_sent}b rt=$request_time';

    access_log /var/log/nginx/access.log lb;
    error_log  /var/log/nginx/error.log warn;

    # ── Shared proxy headers ────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Retry the next replica if one errors out or is momentarily unavailable.
    proxy_next_upstream         error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries   2;

    server {
        listen      80 default_server;
        server_name _;

        # nginx-level health check — answered by nginx itself, never touches the
        # app. Used by the compose healthcheck and any external LB probe.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # Immutable, content-hashed Next.js build assets — cache hard at the edge
        # and in the browser.
        location /_next/static/ {
            set $app_upstream http://app:4000;
            proxy_pass $app_upstream;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Everything else → the app (load-balanced across replicas).
        location / {
            set $app_upstream http://app:4000;
            proxy_pass $app_upstream;
        }
    }
}
