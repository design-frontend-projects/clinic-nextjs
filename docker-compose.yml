# ─────────────────────────────────────────────────────────────────────────────
# Clinic Next.js app — Coolify / VPS production & local Docker Compose stack.
#
# The primary database is Supabase (external) — `DATABASE_URL` / `DIRECT_URL`
# point there.
#
# Optional profiles (not started by default on Coolify):
#   - `nginx`   → local reverse proxy + load balancer on :80
#                 (`docker compose --profile nginx up -d --scale app=3`)
#   - `localdb` → local Postgres on :5472 for offline dev
#                 (`docker compose --profile localdb up -d`)
#
# Values come from Coolify's Environment Variables (or local `.env`).
# Never commit real secrets. See `.env.example`.
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time.
        # In Coolify, mark these as "Available at Buildtime".
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DIRECT_URL: ${DIRECT_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
    # Coolify's reverse proxy (Traefik/Caddy) routes HTTPS traffic directly to
    # exposed port 4000 without publishing a colliding host port.
    expose:
      - "4000"
    restart: unless-stopped
    networks:
      - clinic-net

  # Optional nginx — local reverse proxy + load balancer (:80).
  # Kept behind a profile so Coolify's own proxy owns host ports 80/443.
  # Enable locally with:  docker compose --profile nginx up -d --scale app=3
  nginx:
    image: nginx:1.27-alpine
    profiles: ["nginx"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinic-net

  # waha:
  #   # WAHA Core (free, OSS). Supports session management + text sends.
  #   image: devlikeapro/waha:latest
  #   environment:
  #     # Protects every WAHA API call — clients must send `X-Api-Key`.
  #     WHATSAPP_HTTP_API_KEY: ${WAHA_API_KEY}
  #     WAHA_DASHBOARD_ENABLED: "true"
  #     WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
  #     WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
  #     WHATSAPP_DEFAULT_ENGINE: WEBJS
  #     WAHA_PRINT_QR: "true"
  #   ports:
  #     # Dashboard + Swagger + QR at http://localhost:3000
  #     - "3000:3000"
  #   volumes:
  #     # Persist the linked WhatsApp session across restarts.
  #     - waha-sessions:/app/.sessions
  #   restart: unless-stopped
  #   networks:
  #     - clinic-net

  # Optional local Postgres — dev only. Enable with:
  #   docker compose --profile localdb up
  # Then point DATABASE_URL / DIRECT_URL at postgres://postgres:postgres@postgres:5472/clinic
  postgres:
    image: postgres:16-alpine
    profiles: [ "localdb" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinic
    ports:
      - "5472:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - clinic-net

volumes:
  # waha-sessions:
  postgres-data:

networks:
  clinic-net:
    driver: bridge
